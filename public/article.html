<!doctype html><html lang="ne"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>समाचार | आजको खबर</title><link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"></head><body><div class="topline"><div class="wrap topflex"><a href="/">← आजको खबरको होमपेज</a><a href="/admin">Admin Login</a></div></div><header class="wrap masthead"><a class="brand" href="/"><img class="brandlogo" src="/aajko-khabar-logo.png" alt="आजको खबर — एकेन्द्र मिडिया द्वारा सञ्चालित"><div><strong>आजको खबर</strong><small>एकेन्द्र मिडिया द्वारा सञ्चालित</small></div></a></header><main class="wrap"><article class="article" id="article"><p>समाचार लोड हुँदैछ…</p></article></main><footer><div class="wrap foot"><strong>आजको खबर — एकेन्द्र मिडिया द्वारा सञ्चालित</strong><a href="/">गृहपृष्ठ</a></div></footer><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');
fetch('/api/articles/'+encodeURIComponent(slug)).then(async r=>{if(!r.ok)throw Error('यो समाचार उपलब्ध छैन वा प्रकाशित गरिएको छैन।');return r.json()}).then(a=>{document.title=a.title+' | आजको खबर';document.querySelector('#article').innerHTML=`<span class="badge">${esc(a.category)}</span>${a.is_breaking?'<span class="badge">ब्रेकिङ</span>':''}<h1>${esc(a.title)}</h1><p class="muted">लेखक: ${esc(a.author)} · ${esc(a.created_at)}</p>${a.image?`<img src="${esc(a.image)}" alt="${esc(a.title)}">`:''}<p class="summary">${esc(a.summary)}</p><div class="articlebody">${esc(a.body)}</div><hr><p><a class="button" href="/">← थप समाचार पढ्नुहोस्</a></p>`}).catch(e=>document.querySelector('#article').innerHTML='<h1>समाचार भेटिएन</h1><p>'+esc(e.message)+'</p><a href="/">होमपेज फर्कनुहोस्</a>');
</script></body></html>
